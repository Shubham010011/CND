server {
    listen 8080;
    server_name _;

    location /api/auth/ {
        proxy_pass http://auth-service:8081;
        proxy_set_header Host $host;
    }

    location /api/market/ {
        proxy_pass http://market-service:8082;
        proxy_set_header Host $host;
    }

    location /api/wallet/ {
        proxy_pass http://wallet-service:8084;
        proxy_set_header Host $host;
    }

    location /api/transactions/ {
        proxy_pass http://wallet-service:8084;
        proxy_set_header Host $host;
    }

    location /api/trade/ {
        proxy_pass http://trade-service:8083;
        proxy_set_header Host $host;
    }
}