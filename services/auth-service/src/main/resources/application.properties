spring.application.name=auth-service
server.port=8081
spring.datasource.url=${DB_URL:jdbc:h2:file:/data/authdb}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
app.jwt.secret=${JWT_SECRET:01234567890123456789012345678901}
app.jwt.expiration-ms=86400000
app.internal-key=${INTERNAL_KEY:dev-internal-key}
services.wallet.url=${WALLET_SERVICE_URL:http://wallet-service:8080}
