services:
  auth-service:
    build: ./services/auth-service
    ports:
      - "8081:8081"
    environment:
      JWT_SECRET: ${JWT_SECRET:-01234567890123456789012345678901}
      INTERNAL_KEY: ${INTERNAL_KEY:-dev-internal-key}
      WALLET_SERVICE_URL: http://wallet-service:8084
      DB_URL: jdbc:h2:file:/data/authdb
    volumes:
      - auth-data:/data
    depends_on:
      - wallet-service

  market-service:
    build: ./services/market-service
    ports:
      - "8082:8082"
    environment:
      COINGECKO_APP_KEY: ${COINGECKO_APP_KEY:-}

  wallet-service:
    build: ./services/wallet-service
    ports:
      - "8084:8084"
    environment:
      JWT_SECRET: ${JWT_SECRET:-01234567890123456789012345678901}
      INTERNAL_KEY: ${INTERNAL_KEY:-dev-internal-key}
      DB_URL: jdbc:h2:file:/data/walletdb
    volumes:
      - wallet-data:/data

  trade-service:
    build: ./services/trade-service
    ports:
      - "8083:8083"
    environment:
      JWT_SECRET: ${JWT_SECRET:-01234567890123456789012345678901}
      INTERNAL_KEY: ${INTERNAL_KEY:-dev-internal-key}
      MARKET_SERVICE_URL: http://market-service:8082
      WALLET_SERVICE_URL: http://wallet-service:8084
    depends_on:
      - market-service
      - wallet-service

  api-gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - market-service
      - wallet-service
      - trade-service

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

volumes:
  auth-data:
  wallet-data: