apiVersion: v1
kind: Secret
metadata: {name: cryptox-secrets}
type: Opaque
stringData:
  JWT_SECRET: "change-this-32-character-minimum-secret"
  INTERNAL_KEY: "change-internal-service-key"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: auth-data}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: wallet-data}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: wallet-service}
spec:
  replicas: 1
  selector: {matchLabels: {app: wallet-service}}
  template:
    metadata: {labels: {app: wallet-service}}
    spec:
      containers:
      - name: wallet-service
        image: cryptox/wallet-service:1.0
        env:
        - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: cryptox-secrets, key: JWT_SECRET}}}
        - {name: INTERNAL_KEY, valueFrom: {secretKeyRef: {name: cryptox-secrets, key: INTERNAL_KEY}}}
        - {name: DB_URL, value: "jdbc:h2:file:/data/walletdb"}
        volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: wallet-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: wallet-service}
spec: {selector: {app: wallet-service}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: auth-service}
spec:
  replicas: 1
  selector: {matchLabels: {app: auth-service}}
  template:
    metadata: {labels: {app: auth-service}}
    spec:
      containers:
      - name: auth-service
        image: cryptox/auth-service:1.0
        env:
        - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: cryptox-secrets, key: JWT_SECRET}}}
        - {name: INTERNAL_KEY, valueFrom: {secretKeyRef: {name: cryptox-secrets, key: INTERNAL_KEY}}}
        - {name: WALLET_SERVICE_URL, value: "http://wallet-service:8080"}
        - {name: DB_URL, value: "jdbc:h2:file:/data/authdb"}
        volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: auth-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: auth-service}
spec: {selector: {app: auth-service}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: market-service}
spec: {replicas: 2, selector: {matchLabels: {app: market-service}}, template: {metadata: {labels: {app: market-service}}, spec: {containers: [{name: market-service, image: cryptox/market-service:1.0}]}}}
---
apiVersion: v1
kind: Service
metadata: {name: market-service}
spec: {selector: {app: market-service}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: trade-service}
spec:
  replicas: 2
  selector: {matchLabels: {app: trade-service}}
  template:
    metadata: {labels: {app: trade-service}}
    spec:
      containers:
      - name: trade-service
        image: cryptox/trade-service:1.0
        env:
        - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: cryptox-secrets, key: JWT_SECRET}}}
        - {name: INTERNAL_KEY, valueFrom: {secretKeyRef: {name: cryptox-secrets, key: INTERNAL_KEY}}}
        - {name: MARKET_SERVICE_URL, value: "http://market-service:8080"}
        - {name: WALLET_SERVICE_URL, value: "http://wallet-service:8080"}
---
apiVersion: v1
kind: Service
metadata: {name: trade-service}
spec: {selector: {app: trade-service}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api-gateway}
spec: {replicas: 2, selector: {matchLabels: {app: api-gateway}}, template: {metadata: {labels: {app: api-gateway}}, spec: {containers: [{name: api-gateway, image: cryptox/api-gateway:1.0, ports: [{containerPort: 8080}]}]}}}
---
apiVersion: v1
kind: Service
metadata: {name: api-gateway}
spec: {selector: {app: api-gateway}, ports: [{port: 8080, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend}
spec: {replicas: 2, selector: {matchLabels: {app: frontend}}, template: {metadata: {labels: {app: frontend}}, spec: {containers: [{name: frontend, image: cryptox/frontend:1.0, ports: [{containerPort: 80}]}]}}}
---
apiVersion: v1
kind: Service
metadata: {name: frontend}
spec: {type: NodePort, selector: {app: frontend}, ports: [{port: 80, targetPort: 80, nodePort: 30080}]}
