spring.application.name=crypto-exchange-app
server.port=8080

# ---- Database (H2 file-based so data survives restarts; swap for Postgres in prod) ----
spring.datasource.url=jdbc:h2:file:./data/cryptoxdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JWT ----
# CHANGE THIS SECRET before deploying anywhere real. Must be >= 256 bits for HS256.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ---- Market data (CoinGecko free public API, no key required/still i have added api key since 
#                  api limits exceed i have used free api from coingeko demo account) ----
app.market.base-url=https://api.coingecko.com/api/v3
app.market.api-key=${COINGECKO_APP_KEY:}
app.market.default-coins=bitcoin,ethereum,tether,binancecoin,solana,ripple,dogecoin,cardano

# ---- Demo starter balance credited to every new wallet (simulated funds, not real crypto) ----
app.wallet.starter-balance-usdt=1000
